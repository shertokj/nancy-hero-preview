<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Shertok - Hero Option 2: Photo + Clean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 96px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            align-items: center;
            min-height: 100vh;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .hero-content p {
            font-size: 1.25rem;
            color: #2D2D2D;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .hero-content .states {
            font-size: 1rem;
            color: #6B6B6B;
            margin-bottom: 40px;
        }

        .hero-photo {
            background: #E8E4DD;
            height: 500px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #6B6B6B;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #5B7B6A;
            color: #FFFFFF;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #4A6357;
        }

        .btn-secondary {
            background: transparent;
            color: #5B7B6A;
            padding: 16px 32px;
            border: 2px solid #5B7B6A;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #5B7B6A;
            color: #FFFFFF;
        }

        @media (max-width: 968px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 64px 24px;
            }

            .hero-photo {
                order: -1;
                height: 300px;
            }

            .hero-content h1 {
                font-size: 2.5rem;
            }

            .cta-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Hi, I'm Nancy</h1>
            <p>For 30 years, I've helped people find clarity, build stronger relationships, and create lasting change. Let's talk about what you're going through.</p>
            <p class="states">Licensed in Georgia, Illinois & Wisconsin</p>
            <div class="cta-group">
                <a href="#contact" class="btn-primary">Schedule Free Consultation</a>
                <a href="#about" class="btn-secondary">My Approach</a>
            </div>
        </div>
        <div class="hero-photo" style="background: url('nancy-photo.jpg') center / cover; border-radius: 16px;">
        </div>
    </div>
</body>
</html>
