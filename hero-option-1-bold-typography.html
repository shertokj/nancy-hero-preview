<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Shertok - Hero Option 1: Bold Typography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FDFBF7 0%, #E8E4DD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .hero {
            max-width: 800px;
            text-align: left;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1.1;
            margin-bottom: 32px;
        }

        .hero h1 .accent {
            color: #C96A4D;
        }

        .hero .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            color: #2D2D2D;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .hero .states {
            font-size: 1.125rem;
            color: #6B6B6B;
            margin-bottom: 48px;
        }

        .hero .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #C96A4D;
            color: #FFFFFF;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #E88A7A;
        }

        .btn-secondary {
            background: transparent;
            color: #1A1A1A;
            padding: 16px 32px;
            border: 2px solid #1A1A1A;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #1A1A1A;
            color: #FFFFFF;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }

            .hero .subtitle {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Therapy That Fits <span class="accent">Your Life</span></h1>
        <p class="subtitle">Hi, I'm Nancy. I help people navigate anxiety, relationships, and life transitions with practical tools and 30 years of experience.</p>
        <p class="states">Licensed in Georgia, Illinois & Wisconsin | In-person and secure video sessions</p>
        <div class="cta-group">
            <a href="#contact" class="btn-primary">Schedule Free Consultation</a>
            <a href="#about" class="btn-secondary">Learn More</a>
        </div>
    </div>
</body>
</html>
