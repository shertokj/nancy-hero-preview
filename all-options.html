<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Shertok Website - All Hero Options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            padding: 0;
        }
        .nav {
            background: #FFFFFF;
            padding: 24px 48px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #C96A4D;
            text-decoration: none;
            font-weight: 700;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a {
            color: #2D2D2D;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #C96A4D;
        }
        .main-content {
            padding: 32px;
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 24px;
            background: #FDFBF7;
            border-radius: 8px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            color: #C96A4D;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .header p {
            color: #6B6B6B;
            font-size: 0.875rem;
        }
        .option-section {
            margin-bottom: 64px;
        }
        .option-label {
            background: #C96A4D;
            color: white;
            padding: 12px 24px;
            font-weight: 600;
            margin-bottom: 0;
        }
        iframe {
            width: 100%;
            height: 800px;
            border: 2px solid #E8E4DD;
            border-top: none;
        }
        .divider {
            height: 64px;
            background: linear-gradient(to right, #FDFBF7, #E8E4DD, #FDFBF7);
            margin: 32px 0;
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav-logo">Nancy Shertok</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="payment.html">Payment</a>
    </div>
</nav>

<div class="main-content">
    <div class="header">
        <h1>Website Hero Options</h1>
        <p>Nancy Shertok, MSW, LCSW - Choose your favorite design</p>
    </div>

    <div class="option-section">
        <div class="option-label">Option 1: Bold Typography</div>
        <iframe src="hero-option-1-bold-typography.html"></iframe>
    </div>

    <div class="divider"></div>

    <div class="option-section">
        <div class="option-label">Option 2: Photo + Clean Layout</div>
        <iframe src="hero-option-2-photo-clean.html"></iframe>
    </div>

    <div class="divider"></div>

    <div class="option-section">
        <div class="option-label">Option 3: Split Screen Bold</div>
        <iframe src="hero-option-3-split-screen.html"></iframe>
    </div>

    <div class="divider"></div>

    <div class="option-section">
        <div class="option-label">Option 4: Full-Width Photo</div>
        <iframe src="hero-option-4-full-width-photo.html"></iframe>
    </div>

    <div class="divider"></div>

    <div class="option-section">
        <div class="option-label">Option 5: Minimalist Elegant</div>
        <iframe src="hero-option-5-minimalist.html"></iframe>
    </div>
</div>

</body>
</html>
